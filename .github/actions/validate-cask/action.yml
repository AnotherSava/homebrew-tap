name: Validate the cask
description: Run brew style and brew audit on anothersava/tap/claude-code-dashboard. Both tests.yml and bump-cask.yml call this, so the push/PR gate and the auto-bump gate apply the same rules. Run install-tap first.

inputs:
  github-token:
    description: Token for `brew audit --online`, normally secrets.GITHUB_TOKEN.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # `brew audit --online` calls the GitHub API to validate the homepage and
        # the release URL. Unauthenticated it gets 60 requests/hour shared across
        # everything else running on the runner's IP, which fails at random; the
        # run token raises that to 1,000/hour per repository. No other brew step
        # needs it. This does not confine the token: bump-cask.yml sets GH_TOKEN
        # to the same run token for its whole job, so every step there holds it.
        HOMEBREW_GITHUB_API_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        brew style --cask anothersava/tap/claude-code-dashboard
        # Deliberately not --new. That flag implies the notability check (this
        # repo is well under the fork/watcher/star bar) and the signing check
        # (the upstream build is ad-hoc signed, not notarized), both of which
        # this cask knowingly does not meet, and neither of which affects
        # whether `brew install` works from a third-party tap.
        brew audit --cask --strict --online anothersava/tap/claude-code-dashboard
