name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the working tree as a tap
        uses: ./.github/actions/install-tap

      - name: Validate the cask
        uses: ./.github/actions/validate-cask
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
